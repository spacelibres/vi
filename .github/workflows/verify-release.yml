name: Verify and release VI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Match release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: spacelibre-vi-${{ github.sha }}
          path: |
            artifacts/*.zip
            spacelibre-svg-assets.zip
            spacelibre-motion-source.zip
            08-motion/*-3d*-1080p.mp4
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: spacelibre-vi-${{ github.sha }}
          path: release-assets
      - name: Publish version notes and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          version=os.environ['GITHUB_REF_NAME'][1:]
          text=Path('CHANGELOG.md').read_text()
          section=text.split('## '+version+' ',1)[1].split('\n## ',1)[0]
          Path('release-notes.md').write_text('## '+version+' '+section)
          PY
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "spacelibre VI $GITHUB_REF_NAME" --notes-file release-notes.md release-assets/artifacts/*.zip release-assets/spacelibre-svg-assets.zip release-assets/spacelibre-motion-source.zip release-assets/08-motion/*-3d*-1080p.mp4
